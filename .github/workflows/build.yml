name: Android Release Build

# Roda só quando você criar uma tag no padrão v* (ex: v1.0.0, v0.9.3)
on:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization / build_runner (se necessário)
        run: |
          if grep -q build_runner pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi

      # Sem Play Store: usa a assinatura padrão do Flutter/Android (debug
      # keystore local do runner). Não precisa de secrets nem de keystore
      # próprio. Se o android/app/build.gradle já tiver um signingConfig
      # "release" apontando pra outro keystore, ajuste esse passo.
      - name: Build release APK (arm64-v8a apenas — aparelhos 64-bit modernos)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*arm64-v8a-release.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxtube-arm64-release
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
