name: Android Release Build

on:
  push:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization / build_runner (se necessário)
        run: |
          if grep -q build_runner pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi

      - name: Build release APK (arm64-v8a apenas — aparelhos 64-bit modernos)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*arm64-v8a-release.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxtube-arm64-release
          path: ${{ steps.apk.outputs.path }}
